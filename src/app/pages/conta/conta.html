<div class="conta-container">

    <div class="conta-header">
        <h2>👤 Conta</h2>
        <p class="subtitulo">Gerencie suas informações pessoais</p>
    </div>

    <div class="config-card">

        <!-- Conquistas -->
        <div class="config-item">
            <div class="config-info">
                <label>🏆 Minhas conquistas</label>
                <p>Veja seu progresso e os marcos já alcançados.</p>
            </div>

            <a routerLink="/conquistas" class="btn-link">
                Ver todas →
            </a>
        </div>

        <!-- Nome -->
        <div class="config-item">
            <div class="config-info">
                <label>👤 Nome de usuário</label>
                <p>Seu nome de exibição no sistema</p>
                <span class="config-value">jorge</span>
            </div>

            <button class="btn-config">
                Alterar nome
            </button>
        </div>

        <!-- E-mail -->
        <div class="config-item">
            <div class="config-info">
                <label>📧 E-mail</label>
                <p>Seu endereço de e-mail cadastrado</p>
                <span class="config-value">indiano@gmail.com</span>
            </div>
        </div>

        <!-- Senha -->
        <div class="config-item">
            <div class="config-info">
                <label>🔒 Senha</label>
                <p>Proteja sua conta com uma senha forte</p>
                <span class="config-value">••••••••</span>
            </div>

            <button class="btn-config">
                Alterar senha
            </button>
        </div>

        <!-- Sair -->
        <div class="config-item danger">
            <div class="config-info">
                <label>🚪 Sair da conta</label>
                <p>Encerrar sua sessão atual.</p>
            </div>

            <button class="btn-danger">
                Sair
            </button>
        </div>

    </div>

 

</div>
